<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teste de Conexão — All In One Assistech</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root{
    --bg:#0a0b0d; --panel:#141619; --line:#24272c;
    --text:#e8eaed; --text-dim:#7d8590;
    --accent:#00e0a4; --accent-dim:#063d30;
    --orange:#E85D1A; --warn:#ff5c5c;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  #app{
    position:relative; height:100dvh; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  #backLink{
    position:absolute; z-index:2; top:max(10px, env(safe-area-inset-top)); left:10px;
    background:rgba(20,22,25,0.72); border:1px solid var(--line); border-radius:999px;
    padding:6px 12px; font-size:11px; color:var(--text-dim); text-decoration:none;
  }
  .ring{
    width:120px; height:120px; border-radius:50%;
    border:3px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:38px; margin-bottom:22px;
    transition: border-color 0.3s;
  }
  .ring.online{ border-color: var(--accent); }
  h1{ font-size:20px; font-weight:700; margin-bottom:6px; }
  p.sub{ font-size:14px; color:var(--text-dim); max-width:320px; margin-bottom:8px; line-height:1.5; }
  .readout{ font-size:14px; margin: 14px 0 10px; color: var(--text-dim); line-height: 1.8; }
  .readout b{ color: var(--text); }
  #reloadBtn{
    background: var(--panel); color: var(--text); border:1px solid var(--line);
    font-family:inherit; font-weight:700; font-size:13px; padding:10px 18px;
    border-radius:999px; margin-bottom: 22px; cursor:pointer;
  }
  .confirm-row{ display:flex; gap:12px; }
  button.act{ appearance:none; border:none; cursor:pointer; font-family:inherit; font-weight:700; border-radius:999px; font-size:14px; padding:14px 22px; }
  #okBtn{ background:var(--accent); color:#06231a; }
  #failBtn{ background:transparent; color:var(--warn); border:1px solid #4a2222; }
</style>
</head>
<body>
<div id="app">
  <a id="backLink" href="menu.html">← Menu</a>

  <div class="ring" id="ring">📶</div>
  <h1 id="title">Teste de Wi-Fi</h1>
  <p class="sub" id="instruction">Confirme que o ícone de Wi-Fi está ativo no topo da tela do aparelho. Esta página só carregou porque a internet está funcionando.</p>

  <div class="readout" id="readout"></div>
  <button id="reloadBtn" style="display:none;">🔄 Recarregar página</button>

  <div class="confirm-row">
    <button class="act" id="okBtn">✓ Funcionando</button>
    <button class="act" id="failBtn">✗ Com problema</button>
  </div>
</div>

<script>
(function () {
  const sessionCode = new URLSearchParams(window.location.search).get('session');
  const kind = new URLSearchParams(window.location.search).get('kind') === 'mobile' ? 'mobile' : 'wifi';
  const testId = kind === 'mobile' ? 'mobile-net' : 'wifi';

  const backLink = document.getElementById('backLink');
  if (sessionCode) backLink.href = new URL(`menu.html?session=${sessionCode}`, window.location.href).href;

  if (kind === 'mobile') {
    document.getElementById('title').textContent = 'Teste de Rede Móvel';
    document.getElementById('instruction').textContent =
      'Desative o Wi-Fi do aparelho, deixando só o 4G/5G ligado, e recarregue esta página. Se carregar normalmente, a rede móvel está ok.';
    document.getElementById('reloadBtn').style.display = 'inline-block';
  }

  const ring = document.getElementById('ring');
  const readout = document.getElementById('readout');

  function update() {
    const online = navigator.onLine;
    ring.classList.toggle('online', online);
    ring.textContent = online ? '📶' : '📵';

    let lines = ['Status: <b>' + (online ? 'Online' : 'Offline') + '</b>'];

    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    if (conn) {
      if (conn.effectiveType) lines.push('Tipo estimado: <b>' + conn.effectiveType + '</b>');
      if (typeof conn.downlink === 'number') lines.push('Velocidade estimada: <b>' + conn.downlink + ' Mbps</b>');
      if (typeof conn.rtt === 'number') lines.push('Latência: <b>' + conn.rtt + ' ms</b>');
    } else {
      lines.push('<span style="color:#7d8590">(navegador não expõe detalhes técnicos da rede)</span>');
    }

    readout.innerHTML = lines.join('<br>');
  }

  update();
  window.addEventListener('online', update);
  window.addEventListener('offline', update);

  document.getElementById('reloadBtn').addEventListener('click', () => window.location.reload());

  function saveResult(status) {
    if (!sessionCode) return;
    const key = 'aio-diag-' + sessionCode;
    let results = {};
    try { results = JSON.parse(sessionStorage.getItem(key) || '{}'); } catch {}
    results[testId] = status;
    sessionStorage.setItem(key, JSON.stringify(results));
  }

  function finish(status) {
    saveResult(status);
    if (sessionCode) {
      window.location.href = new URL(`menu.html?session=${sessionCode}`, window.location.href).href;
    }
  }

  document.getElementById('okBtn').addEventListener('click', () => finish('ok'));
  document.getElementById('failBtn').addEventListener('click', () => finish('fail'));
})();
</script>
</body>
</html>
