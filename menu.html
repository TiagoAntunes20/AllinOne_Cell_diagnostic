<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selecione o teste — All In One Assistech</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root{
    --black: #0B0B0C;
    --white: #FAFAF8;
    --paper: #F1EFEA;
    --line: #E3E0D9;
    --gray: #6B6B70;
    --gray-light: #B4B1AA;
    --orange: #E85D1A;
    --orange-dim: #FBE3D4;
    --accent: #1CA05C;
    --accent-dim: #E2F3E9;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body{ height: 100%; background: var(--paper); }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--black);
    padding: max(18px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom));
    min-height: 100dvh;
  }

  header{ text-align: center; margin-bottom: 18px; }
  header .logo{
    display: block;
    height: 24px;
    width: auto;
    margin: 0 auto 8px;
  }
  header h1{ font-size: 18px; font-weight: 700; }
  header .session{
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size: 12px; color: var(--gray); margin-top: 4px;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 520px;
    margin: 0 auto;
  }

  .tile{
    position: relative;
    aspect-ratio: 1 / 1.05;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 12.5px; font-weight: 700;
    letter-spacing: 0.2px;
    color: var(--black);
    padding: 8px;
    text-decoration: none;
    appearance: none;
    -webkit-appearance: none;
  }
  .tile:active{ background: var(--orange-dim); }

  .tile.soon{ color: var(--gray-light); }
  .tile.soon .tag{ color: var(--gray-light); }

  .tile .tag{
    position: absolute; top: 6px; right: 6px;
    font-size: 9px; font-weight: 700;
    padding: 2px 6px; border-radius: 999px;
  }
  .tile.ready .tag{ background: var(--orange-dim); color: var(--orange); }
  .tile.soon .tag{ background: var(--line); color: var(--gray); }
  .tile.ok{ border-color: var(--accent); }
  .tile.ok .tag{ background: var(--accent-dim); color: var(--accent); }
  .tile.fail{ border-color: #C23B3B; }
  .tile.fail .tag{ background: #F7DEDE; color: #C23B3B; }

  #toast{
    position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom));
    transform: translate(-50%, 12px);
    background: var(--black); color: var(--white);
    font-size: 13px; font-weight: 600;
    padding: 10px 18px; border-radius: 999px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #toast.show{ opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

  <header>
    <img class="logo" src="logo.png" alt="All In One Assistech">
    <h1>Selecione o teste</h1>
    <div class="session" id="sessionLabel"></div>
  </header>

  <div class="grid" id="grid"></div>

  <div id="toast">Teste em breve</div>

<script>
(function () {
  // Testes disponíveis. status "ready" = já existe a página do teste.
  // status "soon" = ainda não foi construído, aparece esmaecido.
  const TESTS = [
    { id: 'touch',      label: 'Touch',           status: 'ready', href: 'touch.html' },
    { id: 'speaker',    label: 'Alto-falante',    status: 'ready', href: 'speaker.html' },
    { id: 'mic',        label: 'Microfone',       status: 'ready', href: 'mic.html' },
    { id: 'cam-back',   label: 'Câmera traseira', status: 'ready', href: 'camera.html?facing=environment' },
    { id: 'cam-front',  label: 'Câmera frontal',  status: 'ready', href: 'camera.html?facing=user' },
    { id: 'earpiece',   label: 'Auricular',       status: 'soon',  href: null },
    { id: 'charging',   label: 'Carregamento',    status: 'soon',  href: null },
    { id: 'charge-port',label: 'Conector de carga', status: 'soon', href: null },
    { id: 'wifi',       label: 'Wi-Fi',           status: 'soon',  href: null },
    { id: 'mobile-net', label: 'Rede móvel',      status: 'soon',  href: null },
    { id: 'bluetooth',  label: 'Bluetooth',       status: 'soon',  href: null },
    { id: 'biometry',   label: 'Biometria',       status: 'soon',  href: null },
  ];

  const session = new URLSearchParams(window.location.search).get('session') || '';
  document.getElementById('sessionLabel').textContent = session ? ('Sessão ' + session) : '';

  const storageKey = 'aio-diag-' + (session || 'sem-sessao');

  // Cada teste grava seu próprio resultado aqui ('ok' ou 'fail') ao
  // terminar. O menu só lê — não presume nada no momento do clique.
  function getResults() {
    try { return JSON.parse(sessionStorage.getItem(storageKey) || '{}'); }
    catch { return {}; }
  }

  const grid = document.getElementById('grid');
  const toast = document.getElementById('toast');
  let toastTimer = null;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  function render() {
    const results = getResults();
    grid.innerHTML = '';

    TESTS.forEach(test => {
      const result = results[test.id]; // undefined | 'ok' | 'fail'
      const statusClass = result === 'ok' ? 'ok' : result === 'fail' ? 'fail' : (test.status === 'ready' ? 'ready' : 'soon');
      const tagText = result === 'ok' ? 'OK' : result === 'fail' ? 'Falha' : (test.status === 'ready' ? 'testar' : 'em breve');

      const el = document.createElement(test.status === 'ready' ? 'a' : 'button');
      el.className = 'tile ' + statusClass;
      el.innerHTML = `<span>${test.label}</span><span class="tag">${tagText}</span>`;

      if (test.status === 'ready') {
        const url = new URL(test.href, window.location.href);
        if (session) url.searchParams.set('session', session);
        el.href = url.href;
      } else {
        el.type = 'button';
        el.addEventListener('click', () => showToast(test.label + ' — em breve'));
      }

      grid.appendChild(el);
    });
  }

  render();
})();
</script>
</body>
</html>
