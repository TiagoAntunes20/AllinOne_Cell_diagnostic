<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selecione o teste — All In One Assistech</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root{
    --black: #0B0B0C;
    --white: #FAFAF8;
    --paper: #F1EFEA;
    --line: #E3E0D9;
    --gray: #6B6B70;
    --gray-light: #B4B1AA;
    --orange: #E85D1A;
    --orange-dim: #FBE3D4;
    --accent: #1CA05C;
    --accent-dim: #E2F3E9;
  }
  *{ box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body{ height: 100%; background: var(--paper); }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--black);
    padding: max(18px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom));
    min-height: 100dvh;
  }

  header{ text-align: center; margin-bottom: 14px; }
  header .logo{
    display: block;
    height: 44px;
    width: auto;
    margin: 0 auto 8px;
  }
  header h1{ font-size: 18px; font-weight: 700; }
  header .session{
    font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    font-size: 12px; color: var(--gray); margin-top: 4px;
  }

  .alert{
    max-width: 520px;
    margin: 0 auto 16px;
    background: var(--orange-dim);
    border: 1px solid var(--orange);
    color: #7A3410;
    font-size: 12.5px; font-weight: 600;
    line-height: 1.4;
    padding: 10px 14px;
    border-radius: 8px;
    text-align: center;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 520px;
    margin: 0 auto;
  }

  .tile{
    position: relative;
    aspect-ratio: 1 / 1.05;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 12.5px; font-weight: 700;
    letter-spacing: 0.2px;
    color: var(--black);
    padding: 8px;
    text-decoration: none;
    appearance: none;
    -webkit-appearance: none;
  }
  .tile:active{ background: var(--orange-dim); }

  .tile .tag{
    position: absolute; top: 6px; right: 6px;
    font-size: 9px; font-weight: 700;
    padding: 2px 6px; border-radius: 999px;
  }
  .tile.ready .tag{ background: var(--orange-dim); color: var(--orange); }
  .tile.ok{ border-color: var(--accent); }
  .tile.ok .tag{ background: var(--accent-dim); color: var(--accent); }
  .tile.fail{ border-color: #C23B3B; }
  .tile.fail .tag{ background: #F7DEDE; color: #C23B3B; }

  #finalizeBtn{
    display: block;
    margin: 22px auto 0;
    background: var(--black); color: var(--white);
    border: none; border-radius: 999px;
    font-family: inherit; font-weight: 700; font-size: 13px;
    padding: 12px 26px; cursor: pointer;
  }
  #finalizeBtn:active{ opacity: 0.85; }
  #finalizeBtn:disabled{ opacity: 0.5; }

  #toast{
    position: fixed; left: 50%; bottom: max(22px, env(safe-area-inset-bottom));
    transform: translate(-50%, 12px);
    background: var(--black); color: var(--white);
    font-size: 13px; font-weight: 600;
    padding: 10px 18px; border-radius: 999px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    max-width: 85vw; text-align: center;
  }
  #toast.show{ opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

  <header>
    <img class="logo" src="logo.png" alt="All In One Assistech">
    <h1>Selecione o teste</h1>
    <div class="session" id="sessionLabel"></div>
  </header>

  <div class="alert">⚠️ ATENÇÃO! Teste os botões físicos (volume e power) manualmente — antes ou depois dos testes daqui.</div>

  <div class="grid" id="grid"></div>

  <button id="finalizeBtn">✅ Finalizar diagnóstico</button>

  <div id="toast">Teste em breve</div>

<script src="vendor.mqtt.js"></script>
<script>
(function () {
  const TESTS = [
    { id: 'touch',      label: 'Touch',           href: 'touch.html' },
    { id: 'speaker',    label: 'Alto-falante',    href: 'speaker.html' },
    { id: 'mic',        label: 'Microfone',       href: 'mic.html' },
    { id: 'cam-back',   label: 'Câmera traseira', href: 'camera.html?facing=environment' },
    { id: 'cam-front',  label: 'Câmera frontal',  href: 'camera.html?facing=user' },
    { id: 'earpiece',   label: 'Auricular',       href: 'earpiece.html' },
    { id: 'charging',   label: 'Carregamento',    href: 'charging.html?aspect=charging' },
    { id: 'charge-port',label: 'Conector de carga', href: 'charging.html?aspect=port' },
    { id: 'wifi',       label: 'Wi-Fi',           href: 'network.html?kind=wifi' },
    { id: 'mobile-net', label: 'Rede móvel',      href: 'network.html?kind=mobile' },
    { id: 'bluetooth',  label: 'Bluetooth',       href: 'bluetooth.html' },
    { id: 'biometry',   label: 'Biometria',       href: 'biometry.html' },
  ];

  const session = new URLSearchParams(window.location.search).get('session') || '';
  document.getElementById('sessionLabel').textContent = session ? ('Sessão ' + session) : '';

  const storageKey = 'aio-diag-' + (session || 'sem-sessao');

  function getResults() {
    try { return JSON.parse(sessionStorage.getItem(storageKey) || '{}'); }
    catch { return {}; }
  }

  const grid = document.getElementById('grid');
  const toast = document.getElementById('toast');
  const finalizeBtn = document.getElementById('finalizeBtn');
  let toastTimer = null;

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  function render() {
    const results = getResults();
    grid.innerHTML = '';

    TESTS.forEach(test => {
      const result = results[test.id]; // undefined | 'ok' | 'fail'
      const statusClass = result === 'ok' ? 'ok' : result === 'fail' ? 'fail' : 'ready';
      const tagText = result === 'ok' ? 'OK' : result === 'fail' ? 'Falha' : 'testar';

      const el = document.createElement('a');
      el.className = 'tile ' + statusClass;
      el.innerHTML = `<span>${test.label}</span><span class="tag">${tagText}</span>`;

      const url = new URL(test.href, window.location.href);
      if (session) url.searchParams.set('session', session);
      el.href = url.href;

      grid.appendChild(el);
    });
  }

  render();

  // --- Envio do resultado final pro PC, via broker MQTT público ---
  // Sem backend próprio ainda, então usamos um "correio" público e
  // gratuito só como canal de mensagem: publicamos o resultado numa
  // sala identificada pelo código da sessão, e o painel do PC (que já
  // está escutando essa sala) recebe e troca de tela sozinho.
  finalizeBtn.addEventListener('click', () => {
    const results = getResults();

    if (!session) {
      showToast('Sem sessão ativa — abra pelo QR code do painel.');
      return;
    }
    if (typeof mqtt === 'undefined') {
      showToast('Não foi possível conectar (lib mqtt não carregou).');
      return;
    }

    finalizeBtn.disabled = true;
    showToast('Enviando pro computador...');

    const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
      clientId: 'aio-cel-' + Math.random().toString(16).slice(2)
    });

    const timeout = setTimeout(() => {
      showToast('Não foi possível conectar. Verifique a internet e tente de novo.');
      finalizeBtn.disabled = false;
      client.end(true);
    }, 8000);

    client.on('connect', () => {
      clearTimeout(timeout);
      client.publish('aio-diag/' + session + '/final', JSON.stringify(results), { qos: 1 }, () => {
        showToast('Enviado! Pode fechar esta aba.');
        client.end();
      });
    });

    client.on('error', () => {
      clearTimeout(timeout);
      showToast('Erro de conexão. Tente de novo.');
      finalizeBtn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
