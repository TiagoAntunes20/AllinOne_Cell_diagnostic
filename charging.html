<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teste de Carregamento — All In One Assistech</title>
<link rel="icon" type="image/png" href="logo.png">
<style>
  :root{
    --bg:#0a0b0d; --panel:#141619; --line:#24272c;
    --text:#e8eaed; --text-dim:#7d8590;
    --accent:#00e0a4; --accent-dim:#063d30;
    --orange:#E85D1A; --warn:#ff5c5c;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  #app{
    position:relative; height:100dvh; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  #backLink{
    position:absolute; z-index:2; top:max(10px, env(safe-area-inset-top)); left:10px;
    background:rgba(20,22,25,0.72); border:1px solid var(--line); border-radius:999px;
    padding:6px 12px; font-size:11px; color:var(--text-dim); text-decoration:none;
  }
  .ring{
    width:120px; height:120px; border-radius:50%;
    border:3px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-size:38px; margin-bottom:22px;
    transition: border-color 0.3s;
  }
  .ring.charging{ border-color: var(--accent); }
  h1{ font-size:20px; font-weight:700; margin-bottom:6px; }
  p.sub{ font-size:14px; color:var(--text-dim); max-width:320px; margin-bottom:8px; line-height:1.5; }
  .readout{ font-size:15px; margin: 14px 0 26px; }
  .readout b{ color: var(--accent); }
  .warn-text{ color: var(--warn); font-size: 13px; max-width: 300px; margin-bottom: 20px; line-height:1.5; }
  .confirm-row{ display:flex; gap:12px; }
  button{ appearance:none; border:none; cursor:pointer; font-family:inherit; font-weight:700; border-radius:999px; font-size:14px; padding:14px 22px; }
  #okBtn{ background:var(--accent); color:#06231a; }
  #failBtn{ background:transparent; color:var(--warn); border:1px solid #4a2222; }
</style>
</head>
<body>
<div id="app">
  <a id="backLink" href="menu.html">← Menu</a>

  <div class="ring" id="ring">🔌</div>
  <h1 id="title">Teste de Carregamento</h1>
  <p class="sub" id="instruction">Conecte o carregador no aparelho agora e observe se o status muda pra "Carregando".</p>

  <div class="readout" id="readout"></div>
  <p class="warn-text" id="unsupported" style="display:none;">
    Este navegador não expõe o status de carregamento automaticamente
    (comum no Safari/iOS e Firefox). Confirme manualmente olhando o
    ícone de bateria do sistema.
  </p>

  <div class="confirm-row">
    <button id="okBtn">✓ Funcionando</button>
    <button id="failBtn">✗ Com problema</button>
  </div>
</div>

<script>
(function () {
  const sessionCode = new URLSearchParams(window.location.search).get('session');
  const aspect = new URLSearchParams(window.location.search).get('aspect') === 'port' ? 'port' : 'charging';
  const testId = aspect === 'port' ? 'charge-port' : 'charging';

  const backLink = document.getElementById('backLink');
  if (sessionCode) backLink.href = new URL(`menu.html?session=${sessionCode}`, window.location.href).href;

  if (aspect === 'port') {
    document.getElementById('title').textContent = 'Teste de Conector de Carga';
    document.getElementById('instruction').textContent =
      'Conecte o cabo e balance levemente o conector/cabo. Se a carga cair ou parar ao mexer, é sinal de mau contato no conector.';
  }

  const ring = document.getElementById('ring');
  const readout = document.getElementById('readout');
  const unsupported = document.getElementById('unsupported');

  if ('getBattery' in navigator) {
    navigator.getBattery().then(battery => {
      function update() {
        ring.classList.toggle('charging', battery.charging);
        ring.textContent = battery.charging ? '⚡' : '🔌';
        readout.innerHTML = 'Carregando: <b>' + (battery.charging ? 'Sim' : 'Não') + '</b> · Nível: <b>' + Math.round(battery.level * 100) + '%</b>';
      }
      update();
      battery.addEventListener('chargingchange', update);
      battery.addEventListener('levelchange', update);
    }).catch(() => {
      unsupported.style.display = 'block';
    });
  } else {
    unsupported.style.display = 'block';
  }

  function saveResult(status) {
    if (!sessionCode) return;
    const key = 'aio-diag-' + sessionCode;
    let results = {};
    try { results = JSON.parse(sessionStorage.getItem(key) || '{}'); } catch {}
    results[testId] = status;
    sessionStorage.setItem(key, JSON.stringify(results));
  }

  function finish(status) {
    saveResult(status);
    if (sessionCode) {
      window.location.href = new URL(`menu.html?session=${sessionCode}`, window.location.href).href;
    }
  }

  document.getElementById('okBtn').addEventListener('click', () => finish('ok'));
  document.getElementById('failBtn').addEventListener('click', () => finish('fail'));
})();
</script>
</body>
</html>
