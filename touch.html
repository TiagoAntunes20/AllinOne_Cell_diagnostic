<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Teste de Touch — All In One Assistech</title>
<link rel="icon" type="image/png" href="All-in-One-Icon.ico">
<style>
  :root{
    --bg: #0a0b0d;
    --panel: #141619;
    --line: #24272c;
    --text: #e8eaed;
    --text-dim: #7d8590;
    --accent: #00e0a4;
    --accent-dim: #063d30;
    --warn: #ff5c5c;
    --cell-gap: 2px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: none; user-select: none;
  }
  #app { position: relative; height: 100%; height: 100dvh; width: 100%; }

  /* A grade cobre a tela inteira — inclusive por baixo do HUD. */
  #grid {
    position: absolute; inset: 0;
    display: grid;
    gap: var(--cell-gap);
    padding: var(--cell-gap);
    background: var(--line);
    z-index: 0;
  }
  .cell {
    background: var(--panel);
    border-radius: 2px;
    transition: background-color 60ms linear;
  }
  .cell.hit {
    background: var(--accent);
  }

  /* HUD flutuante: não ocupa espaço da grade e não bloqueia toque,
     exceto exatamente em cima dos botões/badge (pointer-events: auto neles). */
  .hud {
    position: absolute; z-index: 2;
    pointer-events: none;
  }
  .badge {
    top: max(10px, env(safe-area-inset-top));
    right: 10px;
    display: flex; align-items: center; gap: 8px;
    background: rgba(20,22,25,0.72);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
  }
  .badge span#brandSub { font-size: 10px; color: var(--text-dim); display: block; }
  .badge .stat {
    font-variant-numeric: tabular-nums;
    font-size: 15px; font-weight: 700; color: var(--accent);
  }
  .badge .stat.done { color: var(--warn); }

  #fsHint, #backLink {
    position: absolute; z-index: 2;
    top: max(10px, env(safe-area-inset-top));
    left: 10px;
    background: rgba(20,22,25,0.72);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 11px; color: var(--text-dim);
    transition: opacity 0.4s ease;
  }
  #fsHint { pointer-events: none; }
  #backLink { pointer-events: auto; text-decoration: none; display: none; }

  #overlay {
    position: fixed; inset: 0;
    background: rgba(10,11,13,0.96);
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 14px;
    text-align: center; padding: 24px;
    z-index: 10;
    pointer-events: none;
    transition: opacity 0.35s ease;
  }
  #overlay.show { display: flex; }
  #overlay .big { font-size: 48px; font-weight: 800; color: var(--accent); }
  #overlay p { color: var(--text-dim); font-size: 13px; max-width: 280px; }
</style>
</head>
<body>
<div id="app">

  <div id="grid"></div>

  <div class="hud badge">
    <div>
      <span id="brandSub">All In One Assistech</span>
    </div>
    <div class="stat" id="pct">0%</div>
  </div>

  <div id="fsHint">Toque na tela para tela cheia</div>
  <a id="backLink" href="menu.html">← Menu</a>

  <div id="overlay">
    <div class="big">100%</div>
    <p>Tela testada por completo. Reiniciando para o próximo teste...</p>
  </div>

</div>

<script>
(function () {
  // Se a página foi aberta via QR code do painel de diagnóstico,
  // mostra o código da sessão no cabeçalho pra o técnico confirmar
  // visualmente que o celular caiu no teste certo.
  const sessionCode = new URLSearchParams(window.location.search).get('session');
  if (sessionCode) {
    document.getElementById('brandSub').textContent = 'Sessão ' + sessionCode;
  }

  const grid = document.getElementById('grid');
  const pctEl = document.getElementById('pct');
  const overlay = document.getElementById('overlay');
  const fsHint = document.getElementById('fsHint');
  const backLink = document.getElementById('backLink');

  if (sessionCode) {
    const menuUrl = new URL(`menu.html?session=${sessionCode}`, window.location.href).href;
    backLink.href = menuUrl;
  }

  // Pede tela cheia (esconde a barra de endereço do navegador) no
  // primeiro toque do técnico. Precisa de um gesto do usuário — não
  // dá pra pedir isso sozinho ao carregar a página.
  let fsRequested = false;
  function requestFullscreenOnce() {
    if (fsRequested) return;
    fsRequested = true;
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) {
      req.call(el).catch(() => {}); // navegador pode negar; segue sem travar
    }
    fsHint.style.opacity = '0';
    setTimeout(() => {
      fsHint.remove();
      if (sessionCode) backLink.style.display = 'block';
    }, 500);
  }

  // Tamanho alvo de cada célula, em px. A grade se ajusta a qualquer
  // resolução de tela mantendo esse tamanho aproximado.
  const TARGET_CELL_PX = 34;

  let cols = 0, rows = 0, cells = [], hitCount = 0, total = 0;

  function buildGrid() {
    const w = grid.clientWidth;
    const h = grid.clientHeight;
    cols = Math.max(4, Math.round(w / TARGET_CELL_PX));
    rows = Math.max(4, Math.round(h / TARGET_CELL_PX));
    total = cols * rows;
    hitCount = 0;

    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    grid.innerHTML = '';
    cells = [];

    for (let i = 0; i < total; i++) {
      const c = document.createElement('div');
      c.className = 'cell';
      grid.appendChild(c);
      cells.push(c);
    }
    updatePct();
  }

  function markCell(el) {
    if (!el || !el.classList.contains('cell')) return;
    if (el.classList.contains('hit')) return;
    el.classList.add('hit');
    hitCount++;
    updatePct();
    if (hitCount === total) onComplete();
  }

  function saveResult(status) {
    if (!sessionCode) return;
    const key = 'aio-diag-' + sessionCode;
    let results = {};
    try { results = JSON.parse(sessionStorage.getItem(key) || '{}'); } catch {}
    results.touch = status;
    sessionStorage.setItem(key, JSON.stringify(results));
  }

  function onComplete() {
    overlay.classList.add('show');
    saveResult('ok');
    // Some tempinho pro técnico ver a confirmação, depois volta pro
    // menu de testes (se veio de uma sessão) ou reseta a própria
    // grade (se foi aberto direto, sem sessão).
    setTimeout(() => {
      if (sessionCode) {
        const menuUrl = new URL(`menu.html?session=${sessionCode}`, window.location.href).href;
        window.location.href = menuUrl;
        return;
      }
      overlay.style.opacity = '0';
      setTimeout(() => {
        overlay.classList.remove('show');
        overlay.style.opacity = '1';
        buildGrid();
      }, 350);
    }, 1400);
  }

  function updatePct() {
    const pct = total ? Math.round((hitCount / total) * 100) : 0;
    pctEl.textContent = pct + '%';
    pctEl.classList.toggle('done', pct === 100);
  }

  function pointsFromEvent(e) {
    // Suporta multitouch: registra todos os dedos na tela, não só o primeiro.
    if (e.touches && e.touches.length) {
      return Array.from(e.touches).map(t => [t.clientX, t.clientY]);
    }
    return [[e.clientX, e.clientY]];
  }

  function handleMove(e) {
    e.preventDefault();
    requestFullscreenOnce();
    const pts = pointsFromEvent(e);
    for (const [x, y] of pts) {
      const el = document.elementFromPoint(x, y);
      markCell(el);
    }
  }

  grid.addEventListener('touchstart', handleMove, { passive: false });
  grid.addEventListener('touchmove', handleMove, { passive: false });
  grid.addEventListener('pointerdown', handleMove);
  grid.addEventListener('pointermove', (e) => {
    if (e.buttons === 1) handleMove(e);
  });

  window.addEventListener('resize', buildGrid);
  window.addEventListener('orientationchange', () => setTimeout(buildGrid, 200));

  buildGrid();
})();
</script>
</body>
</html>
